version: '3.8'

services:
  asterisk-gateway:
    image: ghcr.io/lucca-guidorizzi/prolexa-asterisk-gateway:latest
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-69.62.97.253}
      TRUNK_HOST: ${TRUNK_HOST:-189.3.77.93}
      TRUNK_PORT: ${TRUNK_PORT:-5060}
      TRUNK_USER: ${TRUNK_USER}
      TRUNK_PASSWORD: ${TRUNK_PASSWORD}
      WEBRTC_EXT_USER: ${WEBRTC_EXT_USER:-1001}
      WEBRTC_EXT_PASS: ${WEBRTC_EXT_PASS:-ProlexaSecret1001@}
      CF_TOKEN: ${CF_TOKEN}
      CF_ZONE_ID: ${CF_ZONE_ID:-1d3989b8d19877d632c6296341520265}
    ports:
      # WSS para WebSockets WebRTC do Navegador
      - target: 8089
        published: 8089
        protocol: tcp
        mode: host
      # SIP UDP e TCP para a Operadora GoSat
      - target: 5060
        published: 5060
        protocol: udp
        mode: host
      - target: 5060
        published: 5060
        protocol: tcp
        mode: host
      # Portas RTP para tráfego de voz direto (sem NAT do Swarm mesh)
      - target: 10000
        published: 10000
        protocol: udp
        mode: host
      - target: 10001
        published: 10001
        protocol: udp
        mode: host
      - target: 10002
        published: 10002
        protocol: udp
        mode: host
      - target: 10003
        published: 10003
        protocol: udp
        mode: host
      - target: 10004
        published: 10004
        protocol: udp
        mode: host
      - target: 10005
        published: 10005
        protocol: udp
        mode: host
      - target: 10006
        published: 10006
        protocol: udp
        mode: host
      - target: 10007
        published: 10007
        protocol: udp
        mode: host
      - target: 10008
        published: 10008
        protocol: udp
        mode: host
      - target: 10009
        published: 10009
        protocol: udp
        mode: host
      - target: 10010
        published: 10010
        protocol: udp
        mode: host
    volumes:
      - asterisk-recordings:/var/spool/asterisk/monitor
      - asterisk-logs:/var/log/asterisk
      - asterisk-keys:/etc/asterisk/keys
      - acme-data:/root/.acme.sh
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  asterisk-recordings:
  asterisk-logs:
  asterisk-keys:
  acme-data:
