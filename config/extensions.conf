; ==============================================================================
; Asterisk Dialplan (extensions.conf) - Prolexa CRM
; Author: Lagana Flow
; ==============================================================================

[general]
static=yes
writeprotect=no

[from-webrtc]
; Chamada de teste de áudio / eco (disque *43 no discador para testar seu microfone e áudio)
exten => *43,1,NoOp(Teste de Eco WebRTC - Prolexa)
 same => n,Answer()
 same => n,Playback(demo-echodone)
 same => n,Echo()
 same => n,Hangup()

; Chamadas saintes para números normais (DDD + Número ou 0 + DDD + Número)
exten => _X.,1,NoOp(Chamada sainte iniciada via CRM WebRTC para: ${EXTEN})
 same => n,Set(CALLERID(num)=${TRUNK_USER})
 same => n,Set(CALLERID(name)=${TRUNK_USER})
 ; Opcional: Gravação automática de chamadas
 same => n,Set(RECORDING_FILE=/var/spool/asterisk/monitor/call-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${EXTEN}.wav)
 same => n,MixMonitor(${RECORDING_FILE},b)
 ; Envia para o tronco da operadora
 same => n,Dial(PJSIP/${EXTEN}@gosat-trunk,60,r)
 same => n,NoOp(Dial Status: ${DIALSTATUS})
 same => n,Hangup()

[from-trunk]
; Chamadas entrantes da operadora para o ramal WebRTC do CRM
exten => _X.,1,NoOp(Chamada recebida da operadora para: ${EXTEN})
 same => n,Dial(PJSIP/1001,30,r)
 same => n,Hangup()
