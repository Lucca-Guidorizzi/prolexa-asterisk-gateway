; ==============================================================================
; Asterisk PJSIP Configuration for Prolexa WebRTC Gateway
; Bridge: Browser (WSS + WebRTC + SRTP + DTLS) <---> Operadora (SIP UDP + RTP)
; Author: Lagana Flow
; ==============================================================================

; --- Transports ---

; 1. Transporte UDP para tronco de saída da operadora (GoSat)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8
external_media_address=${PUBLIC_IP}
external_signaling_address=${PUBLIC_IP}

; 2. Transporte WSS seguro para navegadores Web (WebSockets WebRTC)
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8
external_media_address=${PUBLIC_IP}
external_signaling_address=${PUBLIC_IP}

; ==============================================================================
; WebRTC Endpoint Template (Usado pelo navegador web via sip.js)
; ==============================================================================
[webrtc_client](!)
type=endpoint
context=from-webrtc
dtls_auto_generate_cert=yes
webrtc=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
disallow=all
allow=alaw,ulaw
transport=transport-wss

; ==============================================================================
; Ramal WebRTC padrão: 1001 (Utilizado pelo CRM)
; ==============================================================================
[1001](webrtc_client)
auth=auth1001
aors=1001
callerid=Prolexa Web <1001>

[auth1001]
type=auth
auth_type=userpass
password=${WEBRTC_EXT_PASS}
username=1001

[1001]
type=aor
max_contacts=5
remove_existing=yes

; ==============================================================================
; Tronco SIP Operadora (GoSat Telecom)
; ==============================================================================
[gosat-trunk]
type=endpoint
context=from-trunk
disallow=all
allow=alaw,ulaw
transport=transport-udp
outbound_auth=gosat-trunk-auth
aors=gosat-trunk
from_user=${TRUNK_USER}
from_domain=${TRUNK_HOST}
direct_media=no

[gosat-trunk-auth]
type=auth
auth_type=userpass
username=${TRUNK_USER}
password=${TRUNK_PASSWORD}

[gosat-trunk]
type=aor
contact=sip:${TRUNK_HOST}:${TRUNK_PORT}

; Registro na operadora (se a operadora exigir REGISTER)
[gosat-reg]
type=registration
transport=transport-udp
outbound_auth=gosat-trunk-auth
server_uri=sip:${TRUNK_HOST}:${TRUNK_PORT}
client_uri=sip:${TRUNK_USER}@${TRUNK_HOST}:${TRUNK_PORT}
contact_user=${TRUNK_USER}
retry_interval=20
forbidden_retry_interval=300
max_retries=10
expiration=3600
auth_rejection_permanent=no
